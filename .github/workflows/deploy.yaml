name: Generate docs

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  generate-docs:
    name: Generate docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install Roc
        uses: roc-lang/setup-roc@39c354a6a838a0089eea9068a0414f49b62c5c08
        with:
          version: alpha4-rolling
      - name: Generate docs
        run: roc docs package/main.roc
      - name: List contents of generated-docs directory (before fix paths)
        run: ls -R generated-docs
      - name: Fix absolute paths
        run: |
          find generated-docs/ -type f -name '*.html' -exec sed -i "s/\(href\|src\)=\"\//\1=\"\/${{ github.event.repository.name }}\//g" {} +
      - name: List contents of generated-docs directory (after fix paths)
        run: ls -R generated-docs
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: generated-docs
      - name: Deploy docs
        uses: actions/deploy-pages@v4.0.5
    environment:
      name: github-pages
